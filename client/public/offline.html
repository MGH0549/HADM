<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2d7165">
  <title>Hadm — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8f8f4;color:#263a35;font:16px/1.6 'Segoe UI',Arial,sans-serif}.card{width:min(100%,440px);padding:32px;border:1px solid #e7ebe6;border-radius:22px;background:white;text-align:center}.mark{width:64px;height:64px;margin:0 auto 20px;display:grid;place-items:center;border-radius:20px;background:#e8f1eb;color:#2d7165;font-size:32px}.muted{color:#77847f;font-size:14px}button{margin-top:14px;border:0;border-radius:10px;padding:12px 18px;background:#2d7165;color:white;font:inherit;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="mark">ه</div><h1>You’re offline</h1><p class="muted">Reconnect to use your diary. Hadm keeps health entries on the server and does not store them for offline access.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
